# Feature List                            アプリの機能を3〜5個記入してください。
# Font Awesome アイコン一覧: https://fontawesome.com/v5/icons
features                                  :

  - title                                 : 3行で今日を記録
    description                           : 3つの入力欄に1日の出来事を記録。1行あたり最大40文字（全角は2文字分）まで入力でき、文字数をリアルタイムで確認できます。
    fontawesome_icon_name                 : pencil-alt

  - title                                 : 自動保存
    description                           : 入力のたびに自動保存されるため、書きかけのまま閉じても安心です。
    fontawesome_icon_name                 : save

  - title                                 : カレンダーで振り返る
    description                           : 「履歴」タブのカレンダーと一覧から過去のエントリを確認・編集できます。
    fontawesome_icon_name                 : calendar-alt

  - title                                 : X や iOS 共有シートへ投稿
    description                           : 1タップで3行の内容を X のポスト画面、または iOS 標準の共有シートへ送れます。
    fontawesome_icon_name                 : share-alt



